<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="452" viewBox="0 0 1200 452" role="img" aria-labelledby="ht hd">
<title id="ht">AI phone call agent for n8n</title>
<desc id="hd">n8n reads leads from a Google Sheet, Vapi calls them over Twilio, the email is pulled out of the spoken transcript, and the result lands in Slack and back in the sheet.</desc>
<defs>
  <linearGradient id="ground" x1="0" y1="0" x2="1200" y2="452" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#1a1d2e"/><stop offset="1" stop-color="#121422"/>
  </linearGradient>
  <radialGradient id="halo" cx="1008" cy="226" r="400" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#9184d9" stop-opacity="0.16"/><stop offset="1" stop-color="#9184d9" stop-opacity="0"/>
  </radialGradient>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace; }
    .ui { font-family: Inter, system-ui, -apple-system, sans-serif; }
    .p { fill: #9184d9; }
    .cmd { fill: #e9e9ed; }
    .jb { fill: #6e7189; }
    .jk { fill: #a89ce4; }
    .jv { fill: #c8cadb; }
    .cur { fill: #9184d9; animation: blink 1.1s step-end infinite; }
    .fld { opacity: 0 }
    .f1 { animation: fade 7.8s ease-out infinite 0.4s }
    .f2 { animation: fade 7.8s ease-out infinite 1.3s }
    .f3 { animation: fade 7.8s ease-out infinite 2.2s }
    .f4 { animation: fade 7.8s ease-out infinite 3.1s }
    .f5 { animation: fade 7.8s ease-out infinite 4s }
    .ping { animation: ping 7.8s ease-out infinite }
    @keyframes blink { 0%, 49% { opacity: 1 } 50%, 100% { opacity: 0 } }
    @keyframes fade {
      0%   { opacity: 0; transform: translateY(5px) }
      4%   { opacity: 1; transform: translateY(0) }
      88%  { opacity: 1; transform: translateY(0) }
      95%, 100% { opacity: 0; transform: translateY(0) }
    }
    @keyframes ping {
      0%, 3%  { opacity: 0.25 }
      6%      { opacity: 1 }
      90%     { opacity: 1 }
      97%, 100% { opacity: 0.25 }
    }
  </style>
</defs>

<rect width="1200" height="452" rx="14" fill="url(#ground)"/>
<rect width="1200" height="452" rx="14" fill="url(#halo)"/>
<rect x="0.5" y="0.5" width="1199" height="451" rx="14" fill="none" stroke="#2b2e46"/>

<g transform="translate(1008 0)">
  <rect x="-152" y="88" width="304" height="264" rx="10" fill="#171a2a" stroke="#2b2e46"/>
  <rect x="-152" y="88" width="4" height="264" rx="2" fill="#9184d9" opacity="0.55"/>

  <circle class="ping" cx="-128" cy="118" r="5" fill="#5fb98a"/>
  <text x="-114" y="123" class="ui" font-size="13" font-weight="600" fill="#e9e9ed">Lead processed</text>
  <text x="136" y="123" text-anchor="end" class="mono" font-size="10.5" fill="#6e7189">17:14</text>
  <line x1="-136" y1="140" x2="136" y2="140" stroke="#2b2e46"/>

  <g class="fld f1">
    <text x="-136" y="171" class="mono" font-size="10.5" fill="#6e7189">name</text>
    <text x="-58" y="171" class="ui" font-size="12.5" fill="#c8cadb">Maria Keller</text>
  </g>
  <g class="fld f2">
    <text x="-136" y="205" class="mono" font-size="10.5" fill="#6e7189">email</text>
    <rect x="-62" y="191" width="150" height="20" rx="6" fill="#252a45" stroke="#3d3f60"/>
    <text x="-54" y="205" class="mono" font-size="11.5" fill="#cfc8f2">m.keller@salon.de</text>
  </g>
  <g class="fld f3">
    <text x="-136" y="239" class="mono" font-size="10.5" fill="#6e7189">interest</text>
    <text x="-58" y="239" class="ui" font-size="12.5" fill="#c8cadb">yes</text>
  </g>
  <g class="fld f4">
    <text x="-136" y="273" class="mono" font-size="10.5" fill="#6e7189">audio</text>
    <text x="-58" y="273" class="ui" font-size="12.5" fill="#a89ce4">recording.mp3</text>
  </g>
  <g class="fld f5">
    <text x="-136" y="307" class="mono" font-size="10.5" fill="#6e7189">logged</text>
    <text x="-58" y="307" class="ui" font-size="12.5" fill="#c8cadb">sheet row 24, updated</text>
  </g>

  <text x="-152" y="378" class="mono" font-size="11.5" fill="#6e7189">google sheets <tspan fill="#3d3f60">&#183;</tspan> slack <tspan fill="#3d3f60">&#183;</tspan> <tspan fill="#a89ce4">100+ real leads called</tspan></text>
</g>

<rect x="56" y="48" width="760" height="356" rx="10" fill="#101220" stroke="#2b2e46"/>
<path d="M56 84h760" stroke="#2b2e46"/>
<circle cx="80" cy="66" r="4.5" fill="#343856"/>
<circle cx="98" cy="66" r="4.5" fill="#343856"/>
<circle cx="116" cy="66" r="4.5" fill="#9184d9" opacity="0.55"/>
<text x="140" y="71" class="mono" font-size="13" fill="#6e7189">zsh &#183; tuguidragos@n8n</text>

<g class="mono">
  <text x="84" y="118" class="p" font-size="17">$</text>
  <text x="100" y="118" class="cmd" font-size="17">n8n list:workflow</text>

  <text x="100" y="155" class="jb" font-size="23">1|<tspan class="cmd">AI Phone Call Agent</tspan></text>

  <text x="84" y="191" class="p" font-size="17">$</text>
  <text x="100" y="191" class="cmd" font-size="17">curl -s https://api.vapi.ai/call/$ID | jq .analysis</text>

  <text x="100" y="221" class="jb" font-size="14.5">{</text>

  <text x="118" y="245" class="jk" font-size="14.5">"heard":</text>
  <text x="252" y="245" class="jv" font-size="14.5">"my email is m dot keller at salon dot de",</text>

  <text x="118" y="269" class="jk" font-size="14.5">"extracted":</text>
  <text x="252" y="269" class="jv" font-size="14.5">"m.keller@salon.de",</text>

  <text x="118" y="293" class="jk" font-size="14.5">"interest":</text>
  <text x="252" y="293" class="jv" font-size="14.5">"yes",</text>

  <text x="118" y="317" class="jk" font-size="14.5">"logged":</text>
  <text x="252" y="317" class="jv" font-size="14.5">"google sheets + slack"</text>

  <text x="100" y="341" class="jb" font-size="14.5">}</text>

  <text x="84" y="373" class="p" font-size="17">$</text>
</g>
<rect x="100" y="358" width="2.5" height="19" class="cur"/>
</svg>
